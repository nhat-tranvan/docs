<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="A Dreaming run gathers conversations, has read-only sub-agents read them in parallel, consolidates memory and custom skills, finalizes a Run history summary, and carries unread conversations over to the next run." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>A Dreaming run gathers conversations, has read-only sub-agents read them in parallel, consolidates memory and custom skills, finalizes a Run history summary, and carries unread conversations over to the next run.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e6e"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd6"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="249" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600">One Dreaming run</text>
<rect x="24" y="70" width="136" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="38" y="94" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Gather</text>
<text x="38" y="114" fill="#52514e" font-size="12" text-anchor="start">Conversations in</text>
<text x="38" y="132" fill="#52514e" font-size="12" text-anchor="start">the activity window</text>
<text x="38" y="150" fill="#52514e" font-size="12" text-anchor="start">+ unfinished ones</text>
<circle cx="146" cy="84" r="10" fill="#2a78d6"/>
<text x="146" y="88" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">1</text>
<polyline points="160,118 176,118" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<rect x="178" y="70" width="136" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="192" y="94" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Read</text>
<text x="192" y="114" fill="#52514e" font-size="12" text-anchor="start">Read-only</text>
<text x="192" y="132" fill="#52514e" font-size="12" text-anchor="start">sub-agents read</text>
<text x="192" y="150" fill="#52514e" font-size="12" text-anchor="start">batches in parallel</text>
<circle cx="300" cy="84" r="10" fill="#2a78d6"/>
<text x="300" y="88" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">2</text>
<polyline points="314,118 330,118" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<rect x="332" y="70" width="136" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="346" y="94" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Consolidate</text>
<text x="346" y="114" fill="#52514e" font-size="12" text-anchor="start">Add, edit, merge,</text>
<text x="346" y="132" fill="#52514e" font-size="12" text-anchor="start">delete memory and</text>
<text x="346" y="150" fill="#52514e" font-size="12" text-anchor="start">custom skills</text>
<circle cx="454" cy="84" r="10" fill="#2a78d6"/>
<text x="454" y="88" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">3</text>
<polyline points="468,118 484,118" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<rect x="486" y="70" width="136" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="500" y="94" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Finalize</text>
<text x="500" y="114" fill="#52514e" font-size="12" text-anchor="start">Summary to</text>
<text x="500" y="132" fill="#52514e" font-size="12" text-anchor="start">Run history</text>
<circle cx="608" cy="84" r="10" fill="#2a78d6"/>
<text x="608" y="88" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">4</text>
<polyline points="622,118 638,118" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<rect x="640" y="70" width="136" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="654" y="94" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Carry over</text>
<text x="654" y="114" fill="#52514e" font-size="12" text-anchor="start">Unfinished ones</text>
<text x="654" y="132" fill="#52514e" font-size="12" text-anchor="start">go first next run</text>
<circle cx="762" cy="84" r="10" fill="#2a78d6"/>
<text x="762" y="88" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">5</text>
<polyline points="708,166 708,206 92,206 92,168" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-orange)"/>
<text x="400" y="226" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">Next run starts with the carried-over conversations</text>
</svg>
