<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="In a regular Slack channel every request runs as one account; in an incident war room CloudThinker matches the sender by email and runs as that user or refuses" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>In a regular Slack channel every request runs as one account; in an incident war room CloudThinker matches the sender by email and runs as that user or refuses</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e86b6b"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9d84e8"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="379" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">Who requests run as</text>
<rect x="24" y="56" width="370" height="250" rx="10" fill="#222221" stroke="#2c2c2a" stroke-dasharray="5 4"/>
<text x="40" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">REGULAR SLACK CHANNEL</text>
<rect x="40" y="92" width="130" height="44" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="105.0" y="119.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Slack user A</text>
<polyline points="170,114 210,114 210,176 230,176" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="40" y="154" width="130" height="44" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="105.0" y="181.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Slack user B</text>
<polyline points="170,176 210,176 210,176 230,176" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<rect x="40" y="216" width="130" height="44" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="105.0" y="243.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Slack user C</text>
<polyline points="170,238 210,238 210,176 230,176" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="232" y="132" width="146" height="88" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="246" y="156" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">One account</text>
<text x="246" y="176" fill="#c3c2b7" font-size="12" text-anchor="start">Workspace creator,</text>
<text x="246" y="194" fill="#c3c2b7" font-size="12" text-anchor="start">or org Owner</text>
<circle cx="210" cy="145" r="10" fill="#5b9be6"/>
<text x="210" y="149" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<rect x="406" y="56" width="370" height="250" rx="10" fill="#222221" stroke="#2c2c2a" stroke-dasharray="5 4"/>
<text x="422" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">INCIDENT WAR ROOM</text>
<rect x="422" y="92" width="130" height="44" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="487.0" y="119.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Slack sender</text>
<rect x="612" y="76" width="148" height="76" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="626" y="100" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">That user</text>
<text x="626" y="120" fill="#c3c2b7" font-size="12" text-anchor="start">Match by email</text>
<text x="626" y="138" fill="#c3c2b7" font-size="12" text-anchor="start">with access</text>
<rect x="612" y="196" width="148" height="60" rx="8" fill="#1f1f1e" stroke="#e86b6b" stroke-width="1.5"/>
<text x="626" y="220" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Refused</text>
<text x="626" y="240" fill="#c3c2b7" font-size="12" text-anchor="start">No match with access</text>
<polyline points="552,114 612,114" fill="none" stroke="#4fbf8c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-green)"/>
<circle cx="582" cy="114" r="10" fill="#4fbf8c"/>
<text x="582" y="118" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<polyline points="487,136 487,226 612,226" fill="none" stroke="#e86b6b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-red)"/>
<circle cx="487" cy="190" r="10" fill="#e86b6b"/>
<text x="487" y="194" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<circle cx="34" cy="328" r="10" fill="#5b9be6"/>
<text x="34" y="332" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="50" y="332" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Every request runs as one account, with that account's access</text>
<circle cx="34" cy="350" r="10" fill="#4fbf8c"/>
<text x="34" y="354" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="50" y="354" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">War room: CloudThinker runs the request as the sender's CloudThinker user</text>
<circle cx="530" cy="328" r="10" fill="#e86b6b"/>
<text x="530" y="332" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="546" y="332" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Refused if no match</text>
</svg>
