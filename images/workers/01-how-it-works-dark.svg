<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="How a Worker runs a chat: the Worker connects out to CloudThinker Cloud, runs file and shell work on your machine, and connection commands stay in the cloud" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>How a Worker runs a chat: the Worker connects out to CloudThinker Cloud, runs file and shell work on your machine, and connection commands stay in the cloud</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="469" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600" text-anchor="start">How a Worker runs a chat</text>
<rect x="24" y="56" width="330" height="300" rx="10" fill="#222221" stroke="#2c2c2a" stroke-dasharray="5 4"/>
<text x="40" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">YOUR MACHINE</text>
<rect x="446" y="56" width="330" height="300" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="462" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CLOUDTHINKER CLOUD</text>
<rect x="40" y="94" width="298" height="86" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="54" y="118" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Worker</text>
<text x="54" y="138" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">cloudthinker worker start</text>
<text x="54" y="156" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Outbound HTTPS only, no inbound port</text>
<rect x="40" y="196" width="140" height="144" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="54" y="220" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">File tools</text>
<text x="54" y="240" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Read, write, edit</text>
<text x="54" y="258" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Only inside</text>
<text x="54" y="276" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">--workdir</text>
<rect x="198" y="196" width="140" height="144" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="212" y="220" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Shell</text>
<text x="212" y="240" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">/bin/bash as your</text>
<text x="212" y="258" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">OS account</text>
<text x="212" y="276" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Whole machine,</text>
<text x="212" y="294" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">not sandboxed</text>
<rect x="462" y="94" width="298" height="86" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="476" y="118" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Agent and model</text>
<text x="476" y="138" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Plans the work, reads results</text>
<text x="476" y="156" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">You pick the Worker in Run in</text>
<rect x="462" y="196" width="298" height="70" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="476" y="220" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Connections</text>
<text x="476" y="240" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">aws, kubectl, ... credentials stay here</text>
<rect x="462" y="282" width="298" height="58" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="476" y="306" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Cloud only</text>
<text x="476" y="326" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Cyber runs, browser sessions</text>
<line x1="338" y1="112" x2="460" y2="112" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="399" cy="112" r="10" fill="#5b9be6"/>
<text x="399" y="116" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<line x1="460" y1="138" x2="340" y2="138" stroke="#f08a5d" stroke-width="1.6" marker-end="url(#a-orange)"/>
<circle cx="399" cy="138" r="10" fill="#f08a5d"/>
<text x="399" y="142" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<line x1="338" y1="164" x2="460" y2="164" stroke="#5b9be6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
<circle cx="399" cy="164" r="10" fill="#5b9be6"/>
<text x="399" y="168" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<line x1="110" y1="180" x2="110" y2="194" stroke="#f08a5d" stroke-width="1.6" marker-end="url(#a-orange)"/>
<line x1="268" y1="180" x2="268" y2="194" stroke="#f08a5d" stroke-width="1.6" marker-end="url(#a-orange)"/>
<line x1="611" y1="180" x2="611" y2="194" stroke="#4fbf8c" stroke-width="1.6" marker-end="url(#a-green)"/>
<circle cx="631" cy="187" r="10" fill="#4fbf8c"/>
<text x="631" y="191" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<circle cx="34" cy="380" r="10" fill="#5b9be6"/>
<text x="34" y="384" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="50" y="384" fill="#c3c2b7" font-size="11.5" font-weight="400" text-anchor="start">The Worker connects out and waits for work.</text>
<circle cx="34" cy="400" r="10" fill="#f08a5d"/>
<text x="34" y="404" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="50" y="404" fill="#c3c2b7" font-size="11.5" font-weight="400" text-anchor="start">The agent sends file and shell work to the Worker.</text>
<circle cx="34" cy="420" r="10" fill="#5b9be6"/>
<text x="34" y="424" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="50" y="424" fill="#c3c2b7" font-size="11.5" font-weight="400" text-anchor="start">File contents and command output go back to the model.</text>
<circle cx="34" cy="440" r="10" fill="#4fbf8c"/>
<text x="34" y="444" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="50" y="444" fill="#c3c2b7" font-size="11.5" font-weight="400" text-anchor="start">Connection commands run in the cloud. Turn off Use Connections to block them.</text>
</svg>
