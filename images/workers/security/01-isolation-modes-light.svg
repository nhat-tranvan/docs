<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="Host mode runs commands as your account with the whole machine and network in reach; container mode runs them in a container that mounts only the served folder and reaches the internet only through an allowlist proxy" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Host mode runs commands as your account with the whole machine and network in reach; container mode runs them in a container that mounts only the served folder and reaches the internet only through an allowlist proxy</title>
<defs>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e6e"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="429" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start">Two ways a Worker runs commands</text>
<rect x="24" y="56" width="360" height="350" rx="10" fill="#f4f3ef" stroke="#e1e0d9" stroke-dasharray="5 4"/>
<text x="40" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">HOST MODE (DEFAULT)</text>
<rect x="40" y="94" width="328" height="60" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
<text x="54" y="118" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Worker</text>
<text x="54" y="138" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Runs commands as your OS account</text>
<rect x="40" y="190" width="156" height="104" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="54" y="214" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">The whole machine</text>
<text x="54" y="234" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Every file your</text>
<text x="54" y="252" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">account can read,</text>
<text x="54" y="270" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">such as ~/.ssh</text>
<rect x="212" y="190" width="156" height="104" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="226" y="214" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Any network host</text>
<text x="226" y="234" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">The internet and</text>
<text x="226" y="252" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">your private network</text>
<line x1="118" y1="154" x2="118" y2="188" stroke="#eb6834" stroke-width="1.6" marker-end="url(#a-orange)"/>
<line x1="290" y1="154" x2="290" y2="188" stroke="#eb6834" stroke-width="1.6" marker-end="url(#a-orange)"/>
<rect x="40" y="318" width="328" height="70" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="54" y="342" fill="#eb6834" font-size="13" font-weight="600" text-anchor="start">Labelled "Network unrestricted"</text>
<text x="54" y="362" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Use a dedicated account and keep</text>
<text x="54" y="378" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">credentials out of its home folder</text>
<rect x="416" y="56" width="360" height="350" rx="10" fill="#f4f3ef" stroke="#e1e0d9" stroke-dasharray="5 4"/>
<text x="432" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CONTAINER MODE</text>
<rect x="432" y="94" width="328" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="446" y="118" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Worker</text>
<text x="446" y="138" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Needs Docker or Podman on the machine</text>
<rect x="432" y="190" width="156" height="104" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="446" y="214" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Session container</text>
<text x="446" y="234" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Mounts only the</text>
<text x="446" y="252" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">served folder</text>
<text x="446" y="270" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">No DNS of its own</text>
<rect x="604" y="190" width="156" height="104" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="618" y="214" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Egress proxy</text>
<text x="618" y="234" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">The only way out.</text>
<text x="618" y="252" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Checks each host</text>
<text x="618" y="270" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">on the allowlist</text>
<line x1="510" y1="154" x2="510" y2="188" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<line x1="588" y1="242" x2="602" y2="242" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<line x1="682" y1="294" x2="682" y2="316" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#a-green)"/>
<rect x="432" y="318" width="328" height="70" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="446" y="342" fill="#2f9e6e" font-size="13" font-weight="600" text-anchor="start">Listed host: allowed</text>
<text x="446" y="362" fill="#d64545" font-size="13" font-weight="600" text-anchor="start">Anything else: refused with the reason</text>
<text x="446" y="380" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">IP addresses and private networks too</text>
</svg>
