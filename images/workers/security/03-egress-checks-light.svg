<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="The egress proxy checks a request in order: a host name rather than an IP address, port 80 or 443, a host on the allowlist, and a name that resolves to public addresses only; the first failed check refuses the request with its message" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>The egress proxy checks a request in order: a host name rather than an IP address, port 80 or 443, a host on the allowlist, and a name that resolves to public addresses only; the first failed check refuses the request with its message</title>
<defs>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e6e"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="519" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start">How the egress proxy decides</text>
<text x="420" y="36" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Refused requests get 403 Forbidden and start with</text>
<text x="420" y="54" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">"Blocked by the Worker egress policy:"</text>
<rect x="40" y="70" width="300" height="44" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="54" y="97" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">A command calls https://host/path</text>
<rect x="40" y="140" width="300" height="52" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="54" y="162" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CHECK 1</text>
<text x="54" y="180" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">A host name, not an IP address?</text>
<rect x="40" y="218" width="300" height="52" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="54" y="240" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CHECK 2</text>
<text x="54" y="258" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Port 80 or 443?</text>
<rect x="40" y="296" width="300" height="52" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="54" y="318" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CHECK 3</text>
<text x="54" y="336" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">On the Worker's allowlist?</text>
<rect x="40" y="374" width="300" height="52" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="54" y="396" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CHECK 4</text>
<text x="54" y="414" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Resolves to public addresses only?</text>
<rect x="40" y="452" width="300" height="44" rx="8" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="54" y="479" fill="#2f9e6e" font-size="13" font-weight="600" text-anchor="start">Connected to the host</text>
<line x1="190" y1="114" x2="190" y2="138" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#a-green)"/>
<line x1="190" y1="192" x2="190" y2="216" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#a-green)"/>
<text x="198" y="208" fill="#2f9e6e" font-size="12" font-weight="600" text-anchor="start">Yes</text>
<line x1="190" y1="270" x2="190" y2="294" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#a-green)"/>
<text x="198" y="286" fill="#2f9e6e" font-size="12" font-weight="600" text-anchor="start">Yes</text>
<line x1="190" y1="348" x2="190" y2="372" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#a-green)"/>
<text x="198" y="364" fill="#2f9e6e" font-size="12" font-weight="600" text-anchor="start">Yes</text>
<line x1="190" y1="426" x2="190" y2="450" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#a-green)"/>
<text x="198" y="442" fill="#2f9e6e" font-size="12" font-weight="600" text-anchor="start">Yes</text>
<rect x="420" y="140" width="356" height="52" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
<text x="434" y="162" fill="#d64545" font-size="12" font-weight="600" text-anchor="start">Refused</text>
<text x="434" y="180" fill="#0b0b0b" font-size="12" font-weight="400" text-anchor="start">connect by host name, not by IP address.</text>
<rect x="420" y="218" width="356" height="52" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
<text x="434" y="240" fill="#d64545" font-size="12" font-weight="600" text-anchor="start">Refused</text>
<text x="434" y="258" fill="#0b0b0b" font-size="12" font-weight="400" text-anchor="start">port 22 is not allowed. Use HTTPS on port 443.</text>
<rect x="420" y="296" width="356" height="52" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
<text x="434" y="318" fill="#d64545" font-size="12" font-weight="600" text-anchor="start">Refused</text>
<text x="434" y="336" fill="#0b0b0b" font-size="12" font-weight="400" text-anchor="start">example.com is not on the allowlist. Ask a ...</text>
<rect x="420" y="374" width="356" height="52" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
<text x="434" y="396" fill="#d64545" font-size="12" font-weight="600" text-anchor="start">Refused</text>
<text x="434" y="414" fill="#0b0b0b" font-size="12" font-weight="400" text-anchor="start">... resolves to a private or metadata address.</text>
<line x1="340" y1="166" x2="418" y2="166" stroke="#d64545" stroke-width="1.6" marker-end="url(#a-red)"/>
<text x="370" y="158" fill="#d64545" font-size="12" font-weight="600" text-anchor="middle">No</text>
<line x1="340" y1="244" x2="418" y2="244" stroke="#d64545" stroke-width="1.6" marker-end="url(#a-red)"/>
<text x="370" y="236" fill="#d64545" font-size="12" font-weight="600" text-anchor="middle">No</text>
<line x1="340" y1="322" x2="418" y2="322" stroke="#d64545" stroke-width="1.6" marker-end="url(#a-red)"/>
<text x="370" y="314" fill="#d64545" font-size="12" font-weight="600" text-anchor="middle">No</text>
<line x1="340" y1="400" x2="418" y2="400" stroke="#d64545" stroke-width="1.6" marker-end="url(#a-red)"/>
<text x="370" y="392" fill="#d64545" font-size="12" font-weight="600" text-anchor="middle">No</text>
<text x="420" y="462" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Every address a name resolves to must pass, so a mixed</text>
<text x="420" y="480" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">public and private answer is refused. A name that does</text>
<text x="420" y="498" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">not resolve is refused with "did not resolve".</text>
</svg>
