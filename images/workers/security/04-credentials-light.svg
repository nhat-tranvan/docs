<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Each Worker machine has its own credential for waiting and claiming work, and a run token for one run's calls; CloudThinker checks the credential, the IP allowlist, and two-address use on every call, logs a Security entry when one credential flips between two addresses, and a revoked machine is refused while others keep working" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Each Worker machine has its own credential for waiting and claiming work, and a run token for one run's calls; CloudThinker checks the credential, the IP allowlist, and two-address use on every call, logs a Security entry when one credential flips between two addresses, and a revoked machine is refused while others keep working</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e6e"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="469" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start">What a Worker machine signs in with</text>
<rect x="24" y="56" width="250" height="270" rx="10" fill="#f4f3ef" stroke="#e1e0d9" stroke-dasharray="5 4"/>
<text x="40" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">YOUR MACHINES</text>
<rect x="40" y="96" width="218" height="104" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="54" y="120" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Machine A</text>
<text x="54" y="140" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Its own credential, valid</text>
<text x="54" y="158" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">30 days after last use,</text>
<text x="54" y="176" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">rotated by the Worker</text>
<rect x="40" y="226" width="218" height="84" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="54" y="250" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Machine B, revoked</text>
<text x="54" y="270" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Its runs stop. Machine A</text>
<text x="54" y="288" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">keeps working</text>
<rect x="526" y="56" width="250" height="270" rx="10" fill="#f4f3ef" stroke="#e1e0d9"/>
<text x="542" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CLOUDTHINKER CLOUD</text>
<rect x="542" y="96" width="218" height="122" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
<text x="556" y="120" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Checks on every call</text>
<text x="556" y="142" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Credential valid, not revoked</text>
<text x="556" y="162" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Caller IP in the allowlist,</text>
<text x="556" y="180" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">when one is set</text>
<text x="556" y="200" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Last IP recorded</text>
<rect x="542" y="244" width="218" height="66" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
<text x="556" y="268" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Audit Logs, Security</text>
<text x="556" y="288" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Two IPs in 10 minutes</text>
<line x1="258" y1="118" x2="540" y2="118" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="300" cy="118" r="10" fill="#2a78d6"/>
<text x="300" y="122" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="318" y="110" fill="#2a78d6" font-size="12" font-weight="600" text-anchor="start">Credential</text>
<line x1="258" y1="168" x2="540" y2="168" stroke="#2f9e6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-green)"/>
<circle cx="300" cy="168" r="10" fill="#2f9e6e"/>
<text x="300" y="172" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="318" y="160" fill="#2f9e6e" font-size="12" font-weight="600" text-anchor="start">Run token</text>
<line x1="258" y1="268" x2="420" y2="268" stroke="#d64545" stroke-width="1.6"/>
<line x1="410" y1="258" x2="430" y2="278" stroke="#d64545" stroke-width="2"/>
<line x1="430" y1="258" x2="410" y2="278" stroke="#d64545" stroke-width="2"/>
<circle cx="300" cy="268" r="10" fill="#d64545"/>
<text x="300" y="272" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">3</text>
<line x1="651" y1="218" x2="651" y2="242" stroke="#eb6834" stroke-width="1.6" marker-end="url(#a-orange)"/>
<circle cx="671" cy="230" r="10" fill="#eb6834"/>
<text x="671" y="234" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">4</text>
<circle cx="34" cy="364" r="10" fill="#2a78d6"/>
<text x="34" y="368" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="52" y="368" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">The machine's credential registers it, waits for work, and claims a run.</text>
<circle cx="34" cy="388" r="10" fill="#2f9e6e"/>
<text x="34" y="392" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="52" y="392" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Each claim gets a run token. The run's calls use it, and it ends with the run.</text>
<circle cx="34" cy="412" r="10" fill="#d64545"/>
<text x="34" y="416" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="52" y="416" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">A revoked or expired credential, or an IP outside the allowlist, is refused.</text>
<circle cx="34" cy="436" r="10" fill="#eb6834"/>
<text x="34" y="440" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="52" y="440" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">One credential flipping between two IPs within 10 minutes is logged, at most once an hour.</text>
</svg>
