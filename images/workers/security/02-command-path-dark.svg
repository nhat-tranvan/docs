<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="In container mode the agent sends a command to the Worker, the Worker runs it in the session container, the command reaches the internet only through the egress proxy, which connects a listed host and refuses anything else, and the output returns to the agent" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>In container mode the agent sends a command to the Worker, the Worker runs it in the session container, the command reaches the internet only through the egress proxy, which connects a listed host and refuses anything else, and the output returns to the agent</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e86b6b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="499" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600" text-anchor="start">How one command reaches the network in container mode</text>
<rect x="24" y="56" width="146" height="270" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="38" y="80" fill="#a3a29c" font-size="11" font-weight="600" text-anchor="start">CLOUDTHINKER</text>
<rect x="36" y="96" width="122" height="66" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="50" y="120" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Agent</text>
<text x="50" y="140" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Plans the work</text>
<rect x="196" y="56" width="420" height="270" rx="10" fill="#222221" stroke="#2c2c2a" stroke-dasharray="5 4"/>
<text x="212" y="80" fill="#a3a29c" font-size="11" font-weight="600" text-anchor="start">YOUR MACHINE</text>
<rect x="212" y="96" width="388" height="66" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="226" y="120" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Worker</text>
<text x="226" y="140" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Holds the run token for this run only</text>
<rect x="212" y="200" width="170" height="110" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="226" y="224" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Session container</text>
<text x="226" y="244" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Your folder at</text>
<text x="226" y="262" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">the same path</text>
<text x="226" y="280" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Names don't resolve</text>
<rect x="430" y="200" width="170" height="110" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="444" y="224" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Egress proxy</text>
<text x="444" y="244" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Allowlist from the</text>
<text x="444" y="262" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Worker's settings</text>
<rect x="642" y="56" width="134" height="270" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="656" y="80" fill="#a3a29c" font-size="11" font-weight="600" text-anchor="start">INTERNET</text>
<rect x="654" y="96" width="110" height="66" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="666" y="120" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Listed host</text>
<text x="666" y="140" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">api.github.com</text>
<rect x="654" y="232" width="110" height="66" rx="8" fill="#1f1f1e" stroke="#e86b6b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="666" y="256" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Other host</text>
<text x="666" y="276" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Never reached</text>
<line x1="158" y1="114" x2="210" y2="114" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="184" cy="114" r="10" fill="#5b9be6"/>
<text x="184" y="118" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<line x1="296" y1="162" x2="296" y2="198" stroke="#f08a5d" stroke-width="1.6" marker-end="url(#a-orange)"/>
<circle cx="296" cy="180" r="10" fill="#f08a5d"/>
<text x="296" y="184" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<line x1="382" y1="236" x2="428" y2="236" stroke="#f08a5d" stroke-width="1.6" marker-end="url(#a-orange)"/>
<circle cx="406" cy="236" r="10" fill="#f08a5d"/>
<text x="406" y="240" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<path d="M600 222 L626 222 L626 130 L652 130" fill="none" stroke="#4fbf8c" stroke-width="1.6" marker-end="url(#a-green)"/>
<circle cx="626" cy="176" r="10" fill="#4fbf8c"/>
<text x="626" y="180" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<line x1="428" y1="282" x2="384" y2="282" stroke="#e86b6b" stroke-width="1.6" marker-end="url(#a-red)"/>
<circle cx="406" cy="282" r="10" fill="#e86b6b"/>
<text x="406" y="286" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">5</text>
<line x1="210" y1="146" x2="160" y2="146" stroke="#5b9be6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
<circle cx="184" cy="146" r="10" fill="#5b9be6"/>
<text x="184" y="150" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">6</text>
<circle cx="34" cy="360" r="10" fill="#5b9be6"/>
<text x="34" y="364" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="52" y="364" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">The agent sends a shell command to the Worker over its outbound connection.</text>
<circle cx="34" cy="384" r="10" fill="#f08a5d"/>
<text x="34" y="388" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="52" y="388" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">The Worker runs it in the session container, never on the host.</text>
<circle cx="34" cy="408" r="10" fill="#f08a5d"/>
<text x="34" y="412" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="52" y="412" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">A web request goes to the egress proxy, the container's only route out.</text>
<circle cx="34" cy="432" r="10" fill="#4fbf8c"/>
<text x="34" y="436" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="52" y="436" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">A host on the allowlist is connected.</text>
<circle cx="34" cy="456" r="10" fill="#e86b6b"/>
<text x="34" y="460" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">5</text>
<text x="52" y="460" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Any other host gets 403 Forbidden with a message that names the reason.</text>
<circle cx="34" cy="480" r="10" fill="#5b9be6"/>
<text x="34" y="484" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">6</text>
<text x="52" y="484" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">The command's output goes back to the agent.</text>
</svg>
