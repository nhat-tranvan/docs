<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Example scorecard: caught first 5 of 8 incidents, median lead time 11 minutes, 2 incidents missed by every alert" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Example scorecard: caught first 5 of 8 incidents, median lead time 11 minutes, 2 incidents missed by every alert</title>
<rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start">Example scorecard (illustrative numbers)</text>
<rect x="24" y="56" width="240" height="92" rx="8" fill="none" stroke="#e1e0d9"/>
<text x="40" y="80" fill="#52514e" font-size="12" font-weight="500" text-anchor="start">Caught first</text>
<text x="40" y="116" fill="#0b0b0b" font-size="28" font-weight="600" text-anchor="start">5 of 8</text>
<text x="40" y="136" fill="#898781" font-size="12" font-weight="400" text-anchor="start">incidents in 30 days</text>
<rect x="276" y="56" width="240" height="92" rx="8" fill="none" stroke="#e1e0d9"/>
<text x="292" y="80" fill="#52514e" font-size="12" font-weight="500" text-anchor="start">Median lead time</text>
<text x="292" y="116" fill="#0b0b0b" font-size="28" font-weight="600" text-anchor="start">11 min</text>
<text x="292" y="136" fill="#898781" font-size="12" font-weight="400" text-anchor="start">before your first alert</text>
<rect x="528" y="56" width="240" height="92" rx="8" fill="none" stroke="#e1e0d9"/>
<text x="544" y="80" fill="#52514e" font-size="12" font-weight="500" text-anchor="start">Missed by every alert</text>
<text x="544" y="116" fill="#0b0b0b" font-size="28" font-weight="600" text-anchor="start">2</text>
<text x="544" y="136" fill="#898781" font-size="12" font-weight="400" text-anchor="start">incidents</text>
<text x="24" y="182" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Lead time for each incident the Detector caught first</text>
<line x1="190.0" x2="190.0" y1="198" y2="366" stroke="#e1e0d9" stroke-width="1"/>
<text x="190.0" y="384" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">0 min</text>
<line x1="360.0" x2="360.0" y1="198" y2="366" stroke="#e1e0d9" stroke-width="1"/>
<text x="360.0" y="384" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">10 min</text>
<line x1="530.0" x2="530.0" y1="198" y2="366" stroke="#e1e0d9" stroke-width="1"/>
<text x="530.0" y="384" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">20 min</text>
<line x1="700.0" x2="700.0" y1="198" y2="366" stroke="#e1e0d9" stroke-width="1"/>
<text x="700.0" y="384" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">30 min</text>
<path d="M190,204 H628.0 Q632.0,204 632.0,208 V220 Q632.0,224 628.0,224 H190 Z" fill="#2a78d6"/>
<text x="178" y="218" fill="#52514e" font-size="12" font-weight="500" text-anchor="end">Checkout latency</text>
<text x="640.0" y="218" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">26 min</text>
<path d="M190,238 H492.0 Q496.0,238 496.0,242 V254 Q496.0,258 492.0,258 H190 Z" fill="#2a78d6"/>
<text x="178" y="252" fill="#52514e" font-size="12" font-weight="500" text-anchor="end">Payment errors</text>
<text x="504.0" y="252" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">18 min</text>
<path d="M190,272 H373.0 Q377.0,272 377.0,276 V288 Q377.0,292 373.0,292 H190 Z" fill="#2a78d6"/>
<text x="178" y="286" fill="#52514e" font-size="12" font-weight="500" text-anchor="end">Queue backlog</text>
<text x="385.0" y="286" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">11 min</text>
<path d="M190,306 H339.0 Q343.0,306 343.0,310 V322 Q343.0,326 339.0,326 H190 Z" fill="#2a78d6"/>
<text x="178" y="320" fill="#52514e" font-size="12" font-weight="500" text-anchor="end">DB connections full</text>
<text x="351.0" y="320" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">9 min</text>
<path d="M190,340 H254.0 Q258.0,340 258.0,344 V356 Q258.0,360 254.0,360 H190 Z" fill="#2a78d6"/>
<text x="178" y="354" fill="#52514e" font-size="12" font-weight="500" text-anchor="end">Disk almost full</text>
<text x="266.0" y="354" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">4 min</text>
</svg>
