<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="A backtest fire counts as a catch only inside the window from 60 minutes before the problem starts until the incident is created" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>A backtest fire counts as a catch only inside the window from 60 minutes before the problem starts until the incident is created</title>
<rect x="0.5" y="0.5" width="799" height="339" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start">Backtest: which past fires count as a catch</text>
<rect x="393.3333333333333" y="74" width="275.00000000000006" height="160" rx="4" fill="#2a78d6" fill-opacity="0.1"/>
<text x="530.8333333333334" y="66" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="middle">Catch window</text>
<text x="24" y="125" fill="#52514e" font-size="13" font-weight="500" text-anchor="start">Incident</text>
<line x1="210" x2="760" y1="120" y2="120" stroke="#e1e0d9" stroke-width="1"/>
<text x="24" y="201" fill="#52514e" font-size="13" font-weight="500" text-anchor="start">Backtest fires</text>
<line x1="210" x2="760" y1="196" y2="196" stroke="#e1e0d9" stroke-width="1"/>
<line x1="210.0" x2="210.0" y1="74" y2="234" stroke="#e1e0d9" stroke-width="1"/>
<text x="210.0" y="256" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">08:00</text>
<line x1="301.66666666666663" x2="301.66666666666663" y1="74" y2="234" stroke="#e1e0d9" stroke-width="1"/>
<text x="301.66666666666663" y="256" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">08:30</text>
<line x1="393.3333333333333" x2="393.3333333333333" y1="74" y2="234" stroke="#e1e0d9" stroke-width="1"/>
<text x="393.3333333333333" y="256" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">09:00</text>
<line x1="485.0" x2="485.0" y1="74" y2="234" stroke="#e1e0d9" stroke-width="1"/>
<text x="485.0" y="256" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">09:30</text>
<line x1="576.6666666666666" x2="576.6666666666666" y1="74" y2="234" stroke="#e1e0d9" stroke-width="1"/>
<text x="576.6666666666666" y="256" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">10:00</text>
<line x1="668.3333333333334" x2="668.3333333333334" y1="74" y2="234" stroke="#e1e0d9" stroke-width="1"/>
<text x="668.3333333333334" y="256" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">10:30</text>
<line x1="760.0" x2="760.0" y1="74" y2="234" stroke="#e1e0d9" stroke-width="1"/>
<text x="760.0" y="256" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">11:00</text>
<rect x="570.6666666666666" y="114" width="12" height="12" rx="2" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2" transform="rotate(45 576.6666666666666 120)"/>
<text x="564.6666666666666" y="106" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="end">Problem starts 10:00</text>
<rect x="662.3333333333334" y="114" width="12" height="12" rx="2" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2" transform="rotate(45 668.3333333333334 120)"/>
<text x="668.3333333333334" y="106" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="middle">Incident created 10:30</text>
<circle cx="286.3888888888889" cy="196" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="2"/>
<text x="286.3888888888889" y="224" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">Too early</text>
<circle cx="500.27777777777777" cy="196" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="500.27777777777777" y="224" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="middle">Counts as a catch</text>
<circle cx="729.4444444444445" cy="196" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="2"/>
<text x="729.4444444444445" y="224" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">Too late</text>
<text x="24" y="296" fill="#52514e" font-size="13" font-weight="400" text-anchor="start">The window opens 60 minutes before the problem starts and closes when the incident is created.</text>
<text x="24" y="318" fill="#52514e" font-size="13" font-weight="400" text-anchor="start">Fires closer together than the Detector's cooldown count once.</text>
