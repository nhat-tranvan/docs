<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="The Detector fires at 10:00, the first alert at 10:12, and the incident is created at 10:15, a lead time of 12 minutes" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>The Detector fires at 10:00, the first alert at 10:12, and the incident is created at 10:15, a lead time of 12 minutes</title>
<rect x="0.5" y="0.5" width="799" height="319" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600" text-anchor="start">Caught first: the Detector fires before your alerts</text>
<text x="24" y="97" fill="#c3c2b7" font-size="13" font-weight="500" text-anchor="start">Detector</text>
<line x1="210" x2="760" y1="92" y2="92" stroke="#2c2c2a" stroke-width="1"/>
<text x="24" y="157" fill="#c3c2b7" font-size="13" font-weight="500" text-anchor="start">Your alerts</text>
<line x1="210" x2="760" y1="152" y2="152" stroke="#2c2c2a" stroke-width="1"/>
<text x="24" y="217" fill="#c3c2b7" font-size="13" font-weight="500" text-anchor="start">Incident</text>
<line x1="210" x2="760" y1="212" y2="212" stroke="#2c2c2a" stroke-width="1"/>
<line x1="210.0" x2="210.0" y1="64" y2="236" stroke="#2c2c2a" stroke-width="1"/>
<text x="210.0" y="258" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">09:50</text>
<line x1="393.3333333333333" x2="393.3333333333333" y1="64" y2="236" stroke="#2c2c2a" stroke-width="1"/>
<text x="393.3333333333333" y="258" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">10:00</text>
<line x1="576.6666666666666" x2="576.6666666666666" y1="64" y2="236" stroke="#2c2c2a" stroke-width="1"/>
<text x="576.6666666666666" y="258" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">10:10</text>
<line x1="760.0" x2="760.0" y1="64" y2="236" stroke="#2c2c2a" stroke-width="1"/>
<text x="760.0" y="258" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">10:20</text>
<circle cx="393.3333333333333" cy="92" r="7" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="393.3333333333333" y="76" fill="#f0efec" font-size="12" font-weight="500" text-anchor="middle">10:00 Detector fires</text>
<circle cx="613.3333333333333" cy="152" r="7" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="601.3333333333333" y="136" fill="#f0efec" font-size="12" font-weight="500" text-anchor="end">10:12 First alert fires</text>
<rect x="662.3333333333334" y="206" width="12" height="12" rx="2" fill="#f0efec" stroke="#1a1a19" stroke-width="2" transform="rotate(45 668.3333333333334 212)"/>
<text x="668.3333333333334" y="196" fill="#f0efec" font-size="12" font-weight="500" text-anchor="middle">10:15 Incident created</text>
<line x1="393.3333333333333" x2="393.3333333333333" y1="101" y2="286" stroke="#c3c2b7" stroke-width="1"/>
<line x1="613.3333333333333" x2="613.3333333333333" y1="161" y2="286" stroke="#c3c2b7" stroke-width="1"/>
<line x1="393.3333333333333" x2="613.3333333333333" y1="286" y2="286" stroke="#c3c2b7" stroke-width="2"/>
<rect x="441.33333333333326" y="275" width="124" height="22" rx="11" fill="#1a1a19"/>
<text x="503.33333333333326" y="291" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Lead time: 12 min</text>
