<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="When a PR or MR opens, the Git provider sends CloudThinker an event; CloudThinker gathers the diff, linked ticket and repo files, runs the review, and posts a summary and inline comments on the PR. New pushes get an incremental review." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>When a PR or MR opens, the Git provider sends CloudThinker an event; CloudThinker gathers the diff, linked ticket and repo files, runs the review, and posts a summary and inline comments on the PR. New pushes get an incremental review.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e86b6b"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9d84e8"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="419" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">How Code Review runs</text>
<rect x="20" y="56" width="250" height="284" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="36" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">YOUR GIT PROVIDER</text>
<rect x="36" y="84" width="218" height="64" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="145.0" y="112.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">PR or MR opens</text>
<text x="145.0" y="132.0" fill="#c3c2b7" font-size="12" text-anchor="middle">drafts skipped until ready</text>
<rect x="36" y="172" width="218" height="64" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="145.0" y="200.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Findings on the PR</text>
<text x="145.0" y="220.0" fill="#c3c2b7" font-size="12" text-anchor="middle">summary + inline comments</text>
<rect x="36" y="266" width="218" height="58" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="145.0" y="291.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">New push</text>
<text x="145.0" y="311.0" fill="#c3c2b7" font-size="12" text-anchor="middle">commits since last review</text>
<rect x="290" y="56" width="490" height="284" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="306" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CLOUDTHINKER</text>
<rect x="306" y="84" width="220" height="96" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="416.0" y="110.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Gather context</text>
<text x="416.0" y="130.0" fill="#c3c2b7" font-size="12" text-anchor="middle">Diff</text>
<text x="416.0" y="148.0" fill="#c3c2b7" font-size="12" text-anchor="middle">Linked ticket (extension)</text>
<text x="416.0" y="166.0" fill="#c3c2b7" font-size="12" text-anchor="middle">What Review reads</text>
<rect x="550" y="84" width="214" height="96" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="657.0" y="119.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Review runs</text>
<text x="657.0" y="139.0" fill="#c3c2b7" font-size="12" text-anchor="middle">Fast, Auto or Advanced</text>
<text x="657.0" y="157.0" fill="#c3c2b7" font-size="12" text-anchor="middle">severity + suggested fix</text>
<rect x="306" y="262" width="458" height="62" rx="8" fill="#1f1f1e" stroke="#f08a5d" stroke-width="1.5"/>
<text x="535.0" y="289.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Incremental review</text>
<text x="535.0" y="309.0" fill="#c3c2b7" font-size="12" text-anchor="middle">new commits only; checks earlier findings were fixed</text>
<polyline points="254,116 304,116" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<circle cx="279" cy="100" r="10" fill="#5b9be6"/>
<text x="279" y="104" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<polyline points="526,132 548,132" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<circle cx="538" cy="110" r="10" fill="#5b9be6"/>
<text x="538" y="114" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<polyline points="657,180 657,204 256,204" fill="none" stroke="#4fbf8c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-green)"/>
<circle cx="400" cy="204" r="10" fill="#4fbf8c"/>
<text x="400" y="208" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<polyline points="254,300 304,300" fill="none" stroke="#f08a5d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<circle cx="279" cy="284" r="10" fill="#f08a5d"/>
<text x="279" y="288" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<polyline points="306,276 290,276 290,250 150,250 150,238" fill="none" stroke="#f08a5d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-orange)"/>
<circle cx="46" cy="364" r="10" fill="#5b9be6"/>
<text x="46" y="368" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="62" y="368" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Provider sends an event when a PR or MR opens</text>
<circle cx="46" cy="386" r="10" fill="#5b9be6"/>
<text x="46" y="390" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="62" y="390" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">CloudThinker reads the change, then reviews it</text>
<circle cx="430" cy="364" r="10" fill="#4fbf8c"/>
<text x="430" y="368" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="446" y="368" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">One summary plus inline comments on the PR</text>
<circle cx="430" cy="386" r="10" fill="#f08a5d"/>
<text x="430" y="390" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="446" y="390" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Each new push gets an incremental review</text>
</svg>
