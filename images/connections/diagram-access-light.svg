<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Nested limits: the credential's own permissions are the ceiling, Allow writes decides whether agents can propose changes, and Rules and Approval mode settle each change; Connection setting, no approvals connections such as ClickHouse skip Rules and Approval mode." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Nested limits: the credential's own permissions are the ceiling, Allow writes decides whether agents can propose changes, and Rules and Approval mode settle each change; Connection setting, no approvals connections such as ClickHouse skip Rules and Approval mode.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e6e"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd6"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="379" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600">How access works</text>
<rect x="24" y="56" width="500" height="300" rx="10" fill="#f4f3ef" stroke="#e1e0d9"/>
<text x="40" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">THE CREDENTIAL'S OWN PERMISSIONS: THE CEILING</text>
<text x="40" y="98" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Set in your provider (IAM role, service account, token scopes)</text>
<rect x="44" y="116" width="460" height="216" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="58" y="140" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Allow writes</text>
<text x="58" y="160" fill="#52514e" font-size="12" text-anchor="start">Off: agents only read, every change is refused</text>
<text x="58" y="178" fill="#52514e" font-size="12" text-anchor="start">On: agents can propose changes</text>
<rect x="64" y="196" width="420" height="116" rx="8" fill="#ffffff" stroke="#7c5cd6" stroke-width="1.5"/>
<text x="78" y="220" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Rules and Approval mode</text>
<text x="78" y="240" fill="#52514e" font-size="12" text-anchor="start">Settle each change</text>
<text x="78" y="258" fill="#52514e" font-size="12" text-anchor="start">Manual asks a person before every write</text>
<text x="78" y="276" fill="#52514e" font-size="12" text-anchor="start">Auto · Rules + AI · Ask me (default) approves</text>
<text x="78" y="294" fill="#52514e" font-size="12" text-anchor="start">a safe change, asks you about the rest</text>
<rect x="548" y="56" width="228" height="300" rx="10" fill="#f4f3ef" stroke="#e1e0d9"/>
<text x="564" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">EXCEPTION</text>
<rect x="564" y="96" width="196" height="150" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
<text x="578" y="120" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">No approvals</text>
<text x="578" y="140" fill="#52514e" font-size="12" text-anchor="start">Connection setting,</text>
<text x="578" y="158" fill="#52514e" font-size="12" text-anchor="start">e.g. ClickHouse:</text>
<text x="578" y="176" fill="#52514e" font-size="12" text-anchor="start">With writes allowed,</text>
<text x="578" y="194" fill="#52514e" font-size="12" text-anchor="start">changes run with</text>
<text x="578" y="212" fill="#52514e" font-size="12" text-anchor="start">nobody asked</text>
<text x="564" y="272" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Rules and Approval mode</text>
<text x="564" y="290" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">never see these writes.</text>
<text x="564" y="318" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Use a read-only</text>
<text x="564" y="336" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">database user.</text>
</svg>
