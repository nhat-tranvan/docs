<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-label="Cloud uses an OCI signing key to read infrastructure. Self-host uses a database login to read SQL or make approved row changes.">
<title>Oracle: two separate connection options</title>
<rect width="640" height="450" rx="12" fill="#fcfcfb"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" fill="#0b0b0b">
<text x="24" y="44" font-size="32" font-weight="600">Oracle · two separate connections</text>
<rect x="24" y="74" width="592" height="160" rx="12" fill="#f4f3ef" stroke="#2a78d6" stroke-width="1.5"/>
<text x="48" y="116" font-size="32" font-weight="600" fill="#2a78d6">Cloud</text>
<text x="48" y="160" font-size="30" font-weight="600">OCI signing key</text>
<text x="48" y="204" font-size="28" fill="#52514e">Read OCI resources and problems</text>
<rect x="24" y="258" width="592" height="168" rx="12" fill="#f4f3ef" stroke="#7c5cd6" stroke-width="1.5"/>
<text x="48" y="302" font-size="32" font-weight="600" fill="#7c5cd6">Self-host</text>
<text x="48" y="346" font-size="30" font-weight="600">Database username + password</text>
<text x="48" y="392" font-size="28" fill="#52514e">Read SQL · approved single-row writes</text>
</g></svg>
