<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img" aria-label="You ask CloudThinker a question, CloudThinker reads Google Analytics, and returns an answer.">
<title>How CloudThinker reads Google Analytics</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5b9be6"/></marker></defs>
<rect x="1" y="1" width="798" height="208" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<text x="24" y="31" font-size="15" font-weight="600" fill="#f0efec">Ask a question about your analytics</text>
<rect x="30" y="68" width="168" height="60" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="114" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#f0efec">You</text>
<rect x="315" y="68" width="170" height="60" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="400" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#f0efec">CloudThinker</text>
<rect x="603" y="68" width="167" height="60" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="686" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#f0efec">Google Analytics</text>
<text x="686" y="114" text-anchor="middle" font-size="12" fill="#c3c2b7">Allowed properties</text>
<path d="M198 89 H306" fill="none" stroke="#5b9be6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M485 89 H594" fill="none" stroke="#5b9be6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M315 110 H207" fill="none" stroke="#5b9be6" stroke-width="2" marker-end="url(#arrow)"/>
<g fill="#5b9be6"><circle cx="250" cy="73" r="10"/><circle cx="540" cy="73" r="10"/><circle cx="250" cy="126" r="10"/></g>
<g fill="#1f1f1e" font-size="11" font-weight="600" text-anchor="middle"><text x="250" y="77">1</text><text x="540" y="77">2</text><text x="250" y="130">3</text></g>
<text x="24" y="171" font-size="12" fill="#c3c2b7">1 Ask a question</text><text x="263" y="171" font-size="12" fill="#c3c2b7">2 Read permitted data</text><text x="524" y="171" font-size="12" fill="#c3c2b7">3 Receive an answer</text>
</g></svg>
