<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Nested limits: the credential's own permissions are the ceiling, Allow writes decides whether agents can propose changes, and Rules and Approval mode settle each change; Connection setting, no approvals connections such as ClickHouse skip Rules and Approval mode." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Nested limits: the credential's own permissions are the ceiling, Allow writes decides whether agents can propose changes, and Rules and Approval mode settle each change; Connection setting, no approvals connections such as ClickHouse skip Rules and Approval mode.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e86b6b"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9d84e8"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="379" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">How access works</text>
<rect x="24" y="56" width="500" height="300" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="40" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">THE CREDENTIAL'S OWN PERMISSIONS: THE CEILING</text>
<text x="40" y="98" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Set in your provider (IAM role, service account, token scopes)</text>
<rect x="44" y="116" width="460" height="216" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="58" y="140" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Allow writes</text>
<text x="58" y="160" fill="#c3c2b7" font-size="12" text-anchor="start">Off: agents only read, every change is refused</text>
<text x="58" y="178" fill="#c3c2b7" font-size="12" text-anchor="start">On: agents can propose changes</text>
<rect x="64" y="196" width="420" height="116" rx="8" fill="#1f1f1e" stroke="#9d84e8" stroke-width="1.5"/>
<text x="78" y="220" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Rules and Approval mode</text>
<text x="78" y="240" fill="#c3c2b7" font-size="12" text-anchor="start">Settle each change</text>
<text x="78" y="258" fill="#c3c2b7" font-size="12" text-anchor="start">Manual asks a person before every write</text>
<text x="78" y="276" fill="#c3c2b7" font-size="12" text-anchor="start">Auto · Rules + AI · Ask me (default) approves</text>
<text x="78" y="294" fill="#c3c2b7" font-size="12" text-anchor="start">a safe change, asks you about the rest</text>
<rect x="548" y="56" width="228" height="300" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="564" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">EXCEPTION</text>
<rect x="564" y="96" width="196" height="150" rx="8" fill="#1f1f1e" stroke="#e86b6b" stroke-width="1.5"/>
<text x="578" y="120" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">No approvals</text>
<text x="578" y="140" fill="#c3c2b7" font-size="12" text-anchor="start">Connection setting,</text>
<text x="578" y="158" fill="#c3c2b7" font-size="12" text-anchor="start">e.g. ClickHouse:</text>
<text x="578" y="176" fill="#c3c2b7" font-size="12" text-anchor="start">With writes allowed,</text>
<text x="578" y="194" fill="#c3c2b7" font-size="12" text-anchor="start">changes run with</text>
<text x="578" y="212" fill="#c3c2b7" font-size="12" text-anchor="start">nobody asked</text>
<text x="564" y="272" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Rules and Approval mode</text>
<text x="564" y="290" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">never see these writes.</text>
<text x="564" y="318" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Use a read-only</text>
<text x="564" y="336" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">database user.</text>
</svg>
