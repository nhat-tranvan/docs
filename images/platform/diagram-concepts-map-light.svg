<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="An organization holds workspaces; each workspace holds connections, skills, knowledge and memory that feed agents, approvals that every agent write passes, and the agents that power the products." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>An organization holds workspaces; each workspace holds connections, skills, knowledge and memory that feed agents, approvals that every agent write passes, and the agents that power the products.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e6e"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd6"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="499" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600">How the pieces fit</text>
<rect x="278" y="56" width="220" height="56" rx="8" fill="#ffffff" stroke="#7c5cd6" stroke-width="1.5"/>
<text x="388.0" y="80.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Organization</text>
<text x="388.0" y="100.0" fill="#52514e" font-size="12" text-anchor="middle">billing, plan, members, SSO</text>
<polyline points="388,112 388,142" fill="none" stroke="#7c5cd6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<rect x="24" y="144" width="752" height="252" rx="10" fill="#f4f3ef" stroke="#e1e0d9"/>
<text x="40" y="168" fill="#898781" font-size="11" font-weight="600" text-anchor="start">WORKSPACE</text>
<text x="116" y="168" fill="#898781" font-size="11" font-weight="400" text-anchor="start">one isolated environment</text>
<rect x="48" y="190" width="200" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="148.0" y="216.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Connections</text>
<text x="148.0" y="236.0" fill="#52514e" font-size="12" text-anchor="middle">AWS, GitHub, Datadog...</text>
<rect x="48" y="300" width="200" height="60" rx="8" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="148.0" y="335.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Skills, knowledge, memory</text>
<rect x="290" y="240" width="196" height="70" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
<text x="388.0" y="271.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Agents</text>
<text x="388.0" y="291.0" fill="#52514e" font-size="12" text-anchor="middle">CloudThinker + custom agents</text>
<rect x="566" y="240" width="190" height="70" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
<text x="661.0" y="271.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Approvals</text>
<text x="661.0" y="291.0" fill="#52514e" font-size="12" text-anchor="middle">Rules, Approval mode, approvers</text>
<polyline points="248,220 270,220 270,262 288,262" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<polyline points="248,330 270,330 270,288 288,288" fill="none" stroke="#2f9e6e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-green)"/>
<polyline points="486,275 564,275" fill="none" stroke="#d64545" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-red)"/>
<text x="525" y="267" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">every write</text>
<polyline points="388,310 388,422" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<rect x="278" y="424" width="220" height="56" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
<text x="388.0" y="448.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Products</text>
<text x="388.0" y="468.0" fill="#52514e" font-size="12" text-anchor="middle">Resolve, Review, Cyber, Optimize</text>
</svg>
