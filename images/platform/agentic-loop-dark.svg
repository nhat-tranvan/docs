<text x="480" y="278" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="2" fill="#5EE0E0">ENGINEERS</text>
<text x="480" y="306" text-anchor="middle" font-size="20" font-weight="600" fill="#F2F6F6">Set intent</text>
<text x="480" y="332" text-anchor="middle" font-size="20" font-weight="600" fill="#F2F6F6">&amp; approve</text>
<rect x="356" y="48" width="248" height="104" rx="18" fill="#111719" stroke="#22393B" stroke-width="1.5"/>
<circle cx="396" cy="86" r="16" fill="#0F2E30" stroke="#1F5658"/>
<text x="396" y="90.5" text-anchor="middle" font-size="12" font-weight="700" fill="#5EE0E0">01</text>
<text x="424" y="93" font-size="20" font-weight="600" fill="#F2F6F6">Detect</text>
<text font-size="14" fill="#93A1A3"><tspan x="424" y="118">Watch signals from</tspan><tspan x="424" y="136">your connections</tspan></text>
<rect x="666" y="248" width="248" height="104" rx="18" fill="#111719" stroke="#22393B" stroke-width="1.5"/>
<circle cx="706" cy="286" r="16" fill="#0F2E30" stroke="#1F5658"/>
<text x="706" y="290.5" text-anchor="middle" font-size="12" font-weight="700" fill="#5EE0E0">02</text>
<text x="734" y="293" font-size="20" font-weight="600" fill="#F2F6F6">Analyze</text>
<text font-size="14" fill="#93A1A3"><tspan x="734" y="318">Correlate context</tspan><tspan x="734" y="336">and form a plan</tspan></text>
