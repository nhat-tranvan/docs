<circle cx="396" cy="486" r="16" fill="#0F2E30" stroke="#1F5658"/>
<text x="396" y="490.5" text-anchor="middle" font-size="12" font-weight="700" fill="#5EE0E0">03</text>
<text x="424" y="493" font-size="20" font-weight="600" fill="#F2F6F6">Resolve</text>
<text font-size="14" fill="#93A1A3"><tspan x="424" y="518">Execute under your</tspan><tspan x="424" y="536">autonomy mode</tspan></text>
