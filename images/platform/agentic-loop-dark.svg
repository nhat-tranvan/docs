<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none" font-family="Poppins, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
