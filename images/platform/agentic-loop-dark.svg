</defs>
<circle cx="480" cy="300" r="170" fill="url(#h)"/>
<path d="M623.1,122.6 A310,200 0 0 1 770.4,230.0" stroke="#3DCACA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m)"/>
