<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="A raw event passes Pulse suppression, where noise is dropped and counted; the rest joins a cluster and each signal is classified; a cluster that holds an actionable signal goes to Resolve triage and becomes an incident." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>A raw event passes Pulse suppression, where noise is dropped and counted; the rest joins a cluster and each signal is classified; a cluster that holds an actionable signal goes to Resolve triage and becomes an incident.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e6e"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd6"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="329" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600">From raw event to incident</text>
<rect x="24" y="92" width="96" height="60" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="72.0" y="118.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Raw event</text>
<text x="72.0" y="138.0" fill="#52514e" font-size="12" text-anchor="middle">one alert</text>
<rect x="140" y="56" width="384" height="200" rx="10" fill="#f4f3ef" stroke="#e1e0d9"/>
<text x="156" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">PULSE</text>
<rect x="544" y="56" width="232" height="200" rx="10" fill="#f4f3ef" stroke="#e1e0d9"/>
<text x="560" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">RESOLVE</text>
<rect x="156" y="92" width="104" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="208.0" y="118.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Suppression</text>
<text x="208.0" y="138.0" fill="#52514e" font-size="12" text-anchor="middle">4 checks</text>
<rect x="284" y="92" width="104" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="336.0" y="118.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Cluster</text>
<text x="336.0" y="138.0" fill="#52514e" font-size="12" text-anchor="middle">related signals</text>
<rect x="412" y="92" width="96" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="460.0" y="118.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Classify</text>
<text x="460.0" y="138.0" fill="#52514e" font-size="12" text-anchor="middle">each signal</text>
<rect x="560" y="92" width="92" height="60" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
<text x="606.0" y="127.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Triage</text>
<rect x="672" y="92" width="88" height="60" rx="8" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="716.0" y="127.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Incident</text>
<rect x="156" y="188" width="232" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
<text x="272.0" y="209.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Dropped</text>
<text x="272.0" y="229.0" fill="#52514e" font-size="12" text-anchor="middle">counted, not shown as work</text>
<polyline points="120,122 154,122" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<polyline points="260,122 282,122" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<polyline points="388,122 410,122" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<polyline points="508,122 558,122" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<text x="533" y="178" fill="#52514e" font-size="11" font-weight="400" text-anchor="middle">actionable</text>
<polyline points="652,122 670,122" fill="none" stroke="#2f9e6e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-green)"/>
<polyline points="208,152 208,186" fill="none" stroke="#898781" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
<circle cx="137" cy="104" r="10" fill="#2a78d6"/>
<text x="137" y="108" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">1</text>
<circle cx="208" cy="170" r="10" fill="#898781"/>
<text x="208" y="174" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">2</text>
<circle cx="271" cy="104" r="10" fill="#2a78d6"/>
<text x="271" y="108" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">3</text>
<circle cx="399" cy="104" r="10" fill="#2a78d6"/>
<text x="399" y="108" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">4</text>
<circle cx="533" cy="104" r="10" fill="#eb6834"/>
<text x="533" y="108" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">5</text>
<circle cx="34" cy="282" r="10" fill="#2a78d6"/>
<text x="34" y="286" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="50" y="286" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Ingest</text>
<circle cx="34" cy="306" r="10" fill="#898781"/>
<text x="34" y="310" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="50" y="310" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Suppress: first matching check drops it</text>
<circle cx="340" cy="282" r="10" fill="#2a78d6"/>
<text x="340" y="286" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="356" y="286" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Cluster</text>
<circle cx="340" cy="306" r="10" fill="#2a78d6"/>
<text x="340" y="310" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="356" y="310" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Classify</text>
<circle cx="510" cy="282" r="10" fill="#eb6834"/>
<text x="510" y="286" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">5</text>
<text x="526" y="286" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Triage: match, reopen or open</text>
</svg>
