<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="A write passes four steps in order: Always blocked, Rules, Approval mode, and Who approves; the first step that gives an answer decides whether it runs, waits for a person, or is refused." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>A write passes four steps in order: Always blocked, Rules, Approval mode, and Who approves; the first step that gives an answer decides whether it runs, waits for a person, or is refused.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e86b6b"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9d84e8"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="439" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">How a write is decided</text>
<rect x="24" y="64" width="220" height="64" rx="8" fill="#1f1f1e" stroke="#e86b6b" stroke-width="1.5"/>
<text x="38" y="88" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">1. Always blocked</text>
<text x="38" y="108" fill="#c3c2b7" font-size="12" text-anchor="start">Built-in list of calls</text>
<rect x="24" y="152" width="220" height="64" rx="8" fill="#1f1f1e" stroke="#9d84e8" stroke-width="1.5"/>
<text x="38" y="176" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">2. Rules</text>
<text x="38" y="196" fill="#c3c2b7" font-size="12" text-anchor="start">Allow, Ask first, Deny</text>
<rect x="24" y="240" width="220" height="64" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="38" y="264" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">3. Approval mode</text>
<text x="38" y="284" fill="#c3c2b7" font-size="12" text-anchor="start">Manual or Auto</text>
<rect x="24" y="328" width="220" height="64" rx="8" fill="#1f1f1e" stroke="#a3a29c" stroke-width="1.5"/>
<text x="38" y="352" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">4. Who approves</text>
<text x="38" y="372" fill="#c3c2b7" font-size="12" text-anchor="start">Default approvers or a Rule group</text>
<polyline points="134,128 134,150" fill="none" stroke="#a3a29c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-gray)"/>
<polyline points="134,216 134,238" fill="none" stroke="#a3a29c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-gray)"/>
<polyline points="134,304 134,326" fill="none" stroke="#a3a29c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-gray)"/>
<rect x="290" y="83" width="268" height="26" rx="13.0" fill="#1f1f1e" stroke="#e86b6b" stroke-width="1.5"/>
<text x="424.0" y="100.0" fill="#e86b6b" font-size="12" font-weight="600" text-anchor="middle">Refused, no Rule or person changes it</text>
<polyline points="244,96 286,96" fill="none" stroke="#a3a29c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-gray)"/>
<rect x="290" y="163" width="109" height="26" rx="13.0" fill="#1f1f1e" stroke="#e86b6b" stroke-width="1.5"/>
<text x="344.5" y="180.0" fill="#e86b6b" font-size="12" font-weight="600" text-anchor="middle">Deny: refused</text>
<rect x="409" y="163" width="215" height="26" rx="13.0" fill="#1f1f1e" stroke="#f08a5d" stroke-width="1.5"/>
<text x="516.5" y="180.0" fill="#f08a5d" font-size="12" font-weight="600" text-anchor="middle">Ask first: waits for a person</text>
<rect x="634" y="163" width="96" height="26" rx="13.0" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="682.0" y="180.0" fill="#4fbf8c" font-size="12" font-weight="600" text-anchor="middle">Allow: runs</text>
<polyline points="244,176 286,176" fill="none" stroke="#a3a29c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-gray)"/>
<text x="290" y="210" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Allow still asks a person in Manual. Rules decide once Rule enforcement is on.</text>
<rect x="290" y="259" width="162" height="26" rx="13.0" fill="#1f1f1e" stroke="#f08a5d" stroke-width="1.5"/>
<text x="371.0" y="276.0" fill="#f08a5d" font-size="12" font-weight="600" text-anchor="middle">Manual: asks a person</text>
<rect x="462" y="259" width="288" height="26" rx="13.0" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="606.0" y="276.0" fill="#4fbf8c" font-size="12" font-weight="600" text-anchor="middle">Auto: AI judgment may allow a safe write</text>
<polyline points="244,272 286,272" fill="none" stroke="#a3a29c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-gray)"/>
<text x="290" y="300" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">In Auto, the rest are asked about or refused.</text>
<rect x="290" y="347" width="116" height="26" rx="13.0" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="348.0" y="364.0" fill="#4fbf8c" font-size="12" font-weight="600" text-anchor="middle">Approves: runs</text>
<rect x="416" y="347" width="136" height="26" rx="13.0" fill="#1f1f1e" stroke="#e86b6b" stroke-width="1.5"/>
<text x="484.0" y="364.0" fill="#e86b6b" font-size="12" font-weight="600" text-anchor="middle">Declines: refused</text>
<polyline points="244,360 286,360" fill="none" stroke="#a3a29c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-gray)"/>
<text x="24" y="420" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">When several Rules match one write: Deny beats Ask first, and Ask first beats Allow.</text>
</svg>
