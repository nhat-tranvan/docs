<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Four places can set the Approval mode; the most specific one that is set wins: the chat pick, then the Automation, then the run type, then the workspace mode." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Four places can set the Approval mode; the most specific one that is set wins: the chat pick, then the Automation, then the run type, then the workspace mode.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e86b6b"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9d84e8"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="339" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">Which mode a run uses</text>
<rect x="80" y="60" width="560" height="48" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="360.0" y="89.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">The mode picked for this chat</text>
<circle cx="56" cy="84" r="10" fill="#5b9be6"/>
<text x="56" y="88" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="360" y="118" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">if not set</text>
<rect x="80" y="122" width="560" height="48" rx="8" fill="#1f1f1e" stroke="#9d84e8" stroke-width="1.5"/>
<text x="360.0" y="151.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">The mode of the Automation that started the run</text>
<circle cx="56" cy="146" r="10" fill="#9d84e8"/>
<text x="56" y="150" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="360" y="180" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">if not set</text>
<rect x="80" y="184" width="560" height="48" rx="8" fill="#1f1f1e" stroke="#f08a5d" stroke-width="1.5"/>
<text x="360.0" y="213.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">The mode of the run type</text>
<circle cx="56" cy="208" r="10" fill="#f08a5d"/>
<text x="56" y="212" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="360" y="242" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">if not set</text>
<rect x="80" y="246" width="560" height="48" rx="8" fill="#1f1f1e" stroke="#a3a29c" stroke-width="1.5"/>
<text x="360.0" y="275.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">The workspace mode</text>
<circle cx="56" cy="270" r="10" fill="#a3a29c"/>
<text x="56" y="274" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<polyline points="690,290 690,64" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<text x="706" y="160" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Most</text>
<text x="706" y="176" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">specific</text>
<text x="706" y="192" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">wins</text>
<text x="24" y="322" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">The winner applies even when it is looser than the workspace mode.</text>
</svg>
