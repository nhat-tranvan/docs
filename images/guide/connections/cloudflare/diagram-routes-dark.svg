<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 392" width="600" height="392" role="img" aria-label="Two ways CloudThinker reaches Cloudflare. Hosted MCP: the agent sends the token to Cloudflare's hosted MCP server, which calls the API from Cloudflare's own address, so IP-restricted tokens fail. IP whitelist: the agent sandbox holds only a stand-in token; a protected proxy in your CloudThinker deployment keeps the real token, checks each request, and calls the API from your outbound IP, which the token's IP filter allows." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Two ways CloudThinker reaches Cloudflare. Hosted MCP: the agent sends the token to Cloudflare's hosted MCP server, which calls the API from Cloudflare's own address, so IP-restricted tokens fail. IP whitelist: the agent sandbox holds only a stand-in token; a protected proxy in your CloudThinker deployment keeps the real token, checks each request, and calls the API from your outbound IP, which the token's IP filter allows.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="599" height="391" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="16" y="32" fill="#f0efec" font-size="15" font-weight="600" text-anchor="start">Two ways CloudThinker reaches Cloudflare</text>
<rect x="16" y="48" width="568" height="156" rx="10" fill="#222221" stroke="#2c2c2a"/>
<circle cx="37" cy="70" r="4" fill="#5b9be6"/>
<text x="48" y="74" fill="#a3a29c" font-size="11" font-weight="700" text-anchor="start">HOSTED MCP</text>
<rect x="32" y="90" width="156" height="78" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="44" y="114" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">CloudThinker agent</text>
<text x="44" y="135" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Sends your token</text>
<text x="44" y="152" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">with each call</text>
<rect x="222" y="90" width="156" height="78" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="234" y="114" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Hosted MCP</text>
<text x="234" y="135" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Runs on Cloudflare</text>
<text x="234" y="152" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">and calls the API</text>
<rect x="412" y="90" width="156" height="78" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="424" y="114" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Cloudflare API</text>
<text x="424" y="135" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Sees Cloudflare's</text>
<text x="424" y="152" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">own address</text>
<line x1="190" y1="129.0" x2="219" y2="129.0" stroke="#5b9be6" stroke-width="1.75" marker-end="url(#a-blue)"/>
<line x1="380" y1="129.0" x2="409" y2="129.0" stroke="#5b9be6" stroke-width="1.75" marker-end="url(#a-blue)"/>
<path d="M38,180 l6,10 l-12,0 z" fill="#f08a5d"/>
<text x="50" y="190" fill="#c3c2b7" font-size="12" font-weight="500" text-anchor="start">Leave IP filtering off. IP-restricted tokens fail here.</text>
<rect x="16" y="218" width="568" height="156" rx="10" fill="#222221" stroke="#2c2c2a"/>
<circle cx="37" cy="240" r="4" fill="#4fbf8c"/>
<text x="48" y="244" fill="#a3a29c" font-size="11" font-weight="700" text-anchor="start">IP WHITELIST</text>
<rect x="214" y="228" width="172" height="118" rx="10" fill="none" stroke="#9d84e8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="300.0" y="244" fill="#9d84e8" font-size="10" font-weight="700" text-anchor="middle">YOUR DEPLOYMENT</text>
<rect x="32" y="260" width="156" height="78" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="44" y="284" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Agent sandbox</text>
<text x="44" y="305" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Holds a stand-in</text>
<text x="44" y="322" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">token only</text>
<rect x="222" y="260" width="156" height="78" rx="8" fill="#1f1f1e" stroke="#9d84e8" stroke-width="1.5"/>
<text x="234" y="284" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Protected proxy</text>
<text x="234" y="305" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Keeps the real token,</text>
<text x="234" y="322" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">checks each request</text>
<rect x="412" y="260" width="156" height="78" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="424" y="284" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Cloudflare API</text>
<text x="424" y="305" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Sees your</text>
<text x="424" y="322" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">outbound IP</text>
<line x1="190" y1="299.0" x2="219" y2="299.0" stroke="#4fbf8c" stroke-width="1.75" marker-end="url(#a-green)"/>
<line x1="380" y1="299.0" x2="409" y2="299.0" stroke="#4fbf8c" stroke-width="1.75" marker-end="url(#a-green)"/>
<path d="M33,356 l3.5,3.5 l7,-8" fill="none" stroke="#4fbf8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="50" y="360" fill="#c3c2b7" font-size="12" font-weight="500" text-anchor="start">Allow your deployment's outbound IPs in the token.</text>
</svg>
