<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 244" role="img" aria-label="A saved key discovers models, assigns a model to Pro, and calls your provider account.">
<title>Connect a provider key to a mode</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b9be6"/></marker></defs>
<rect width="800" height="244" rx="12" fill="#1a1a19"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<text x="24" y="29" font-size="15" font-weight="600" fill="#f0efec">Use your provider for the jobs you choose</text>
<rect x="24" y="49" width="552" height="119" rx="12" fill="#222221" stroke="#2c2c2a"/>
<text x="40" y="70" font-size="11" fill="#a3a29c">CLOUDTHINKER</text>
<rect x="40" y="87" width="140" height="58" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="110" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#f0efec">Saved key</text><text x="110" y="130" text-anchor="middle" font-size="12" fill="#c3c2b7">Your credentials</text>
<rect x="230" y="87" width="140" height="58" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="300" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#f0efec">Models</text><text x="300" y="130" text-anchor="middle" font-size="12" fill="#c3c2b7">Provider model list</text>
<rect x="420" y="87" width="140" height="58" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="490" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#f0efec">Pro</text><text x="490" y="130" text-anchor="middle" font-size="12" fill="#c3c2b7">Assigned model</text>
<rect x="620" y="87" width="156" height="58" rx="8" fill="#1f1f1e" stroke="#f08a5d" stroke-width="1.5"/>
<text x="698" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#f0efec">Provider account</text><text x="698" y="130" text-anchor="middle" font-size="12" fill="#c3c2b7">Your provider bills it</text>
<g stroke="#5b9be6" stroke-width="1.5" marker-end="url(#arrow)"><path d="M180 116H230"/><path d="M370 116H420"/><path d="M560 116H620"/></g>
<g fill="#5b9be6"><circle cx="205" cy="94" r="10"/><circle cx="395" cy="94" r="10"/><circle cx="590" cy="94" r="10"/></g>
<g fill="#1f1f1e" font-size="11" text-anchor="middle"><text x="205" y="98">1</text><text x="395" y="98">2</text><text x="590" y="98">3</text></g>
<g fill="#c3c2b7" font-size="12"><text x="24" y="194">1  Discover models with your key.</text><text x="24" y="214">2  Assign a model to a job.</text><text x="420" y="194">3  Run that job on your provider.</text></g>
</g></svg>