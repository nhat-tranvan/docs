<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="A CloudWatch alarm state change goes through an EventBridge rule and API destination to the CloudThinker webhook URL and into Pulse; other accounts or regions forward alarms to a central bus." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>A CloudWatch alarm state change goes through an EventBridge rule and API destination to the CloudThinker webhook URL and into Pulse; other accounts or regions forward alarms to a central bus.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e6e"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd6"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="349" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600">CloudWatch alarms to Pulse</text>
<rect x="20" y="56" width="510" height="130" rx="10" fill="#f4f3ef" stroke="#e1e0d9"/>
<text x="36" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">AWS: MONITORING ACCOUNT</text>
<rect x="36" y="92" width="140" height="70" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="106.0" y="123.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">CloudWatch alarm</text>
<text x="106.0" y="143.0" fill="#52514e" font-size="12" text-anchor="middle">changes state</text>
<rect x="196" y="92" width="140" height="70" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="266.0" y="123.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">EventBridge rule</text>
<text x="266.0" y="143.0" fill="#52514e" font-size="12" text-anchor="middle">Alarm State Change</text>
<rect x="356" y="92" width="156" height="70" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="434.0" y="123.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">API destination</text>
<text x="434.0" y="143.0" fill="#52514e" font-size="12" text-anchor="middle">x-api-key header</text>
<rect x="548" y="56" width="232" height="130" rx="10" fill="#f4f3ef" stroke="#e1e0d9"/>
<text x="564" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CLOUDTHINKER</text>
<rect x="562" y="92" width="100" height="70" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="612.0" y="123.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Webhook URL</text>
<text x="612.0" y="143.0" fill="#52514e" font-size="12" text-anchor="middle">Resolve</text>
<rect x="676" y="92" width="90" height="70" rx="8" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="721.0" y="123.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Pulse</text>
<text x="721.0" y="143.0" fill="#52514e" font-size="12" text-anchor="middle">signal</text>
<polyline points="176,127 194,127" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<circle cx="186" cy="174" r="10" fill="#2a78d6"/>
<text x="186" y="178" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">1</text>
<polyline points="336,127 354,127" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<circle cx="346" cy="174" r="10" fill="#2a78d6"/>
<text x="346" y="178" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">2</text>
<polyline points="512,127 560,127" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<circle cx="536" cy="112" r="10" fill="#2a78d6"/>
<text x="536" y="116" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">3</text>
<polyline points="662,127 674,127" fill="none" stroke="#2f9e6e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-green)"/>
<circle cx="669" cy="174" r="10" fill="#2f9e6e"/>
<text x="669" y="178" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">4</text>
<rect x="20" y="206" width="510" height="124" rx="10" fill="#f4f3ef" stroke="#e1e0d9" stroke-dasharray="5 4"/>
<text x="36" y="230" fill="#898781" font-size="11" font-weight="600" text-anchor="start">SOURCE ACCOUNTS OR REGIONS</text>
<rect x="36" y="244" width="140" height="66" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="106.0" y="273.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">CloudWatch alarm</text>
<text x="106.0" y="293.0" fill="#52514e" font-size="12" text-anchor="middle">default bus</text>
<rect x="196" y="244" width="140" height="66" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
<text x="266.0" y="273.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Forwarding rule</text>
<text x="266.0" y="293.0" fill="#52514e" font-size="12" text-anchor="middle">to central bus</text>
<polyline points="176,277 194,277" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<polyline points="266,244 266,164" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-orange)"/>
<circle cx="250" cy="196" r="10" fill="#eb6834"/>
<text x="250" y="200" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">0</text>
<circle cx="562" cy="228" r="10" fill="#eb6834"/>
<text x="562" y="232" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">0</text>
<text x="578" y="232" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Forwarded to the central bus</text>
<circle cx="562" cy="248" r="10" fill="#2a78d6"/>
<text x="562" y="252" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="578" y="252" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Alarm changes state</text>
<circle cx="562" cy="268" r="10" fill="#2a78d6"/>
<text x="562" y="272" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="578" y="272" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Rule matches the event</text>
<circle cx="562" cy="288" r="10" fill="#2a78d6"/>
<text x="562" y="292" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="578" y="292" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">POST to the webhook URL</text>
<circle cx="562" cy="308" r="10" fill="#2f9e6e"/>
<text x="562" y="312" fill="#fcfcfb" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="578" y="312" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Signal lands in Pulse</text>
</svg>
