<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Your message passes the paste scan and tool output passes the placeholder replacement, so the model, chat, and stored output get placeholders, never the real value" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Your message passes the paste scan and tool output passes the placeholder replacement, so the model, chat, and stored output get placeholders, never the real value</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e86b6b"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9d84e8"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">What's protected, and where</text>
<rect x="24" y="64" width="170" height="60" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="109.0" y="90.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Your message</text>
<text x="109.0" y="110.0" fill="#c3c2b7" font-size="12" text-anchor="middle">or long pasted text</text>
<rect x="24" y="196" width="170" height="60" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="109.0" y="222.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Agent tool output</text>
<text x="109.0" y="242.0" fill="#c3c2b7" font-size="12" text-anchor="middle">secrets, identifiers</text>
<rect x="264" y="58" width="230" height="72" rx="8" fill="#1f1f1e" stroke="#f08a5d" stroke-width="1.5"/>
<text x="278" y="82" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Paste scan</text>
<text x="278" y="102" fill="#c3c2b7" font-size="12" text-anchor="start">Review detected secrets</text>
<text x="278" y="120" fill="#c3c2b7" font-size="12" text-anchor="start">dialog, before it sends</text>
<rect x="264" y="182" width="230" height="88" rx="8" fill="#1f1f1e" stroke="#f08a5d" stroke-width="1.5"/>
<text x="278" y="206" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Placeholder replacement</text>
<text x="278" y="226" fill="#c3c2b7" font-size="12" text-anchor="start">Exact match: run secrets</text>
<text x="278" y="244" fill="#c3c2b7" font-size="12" text-anchor="start">Guardrails pattern rules</text>
<text x="278" y="262" fill="#c3c2b7" font-size="12" text-anchor="start">PII: Guardrails settings</text>
<rect x="560" y="56" width="216" height="220" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="576" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">NEVER GETS THE REAL VALUE</text>
<rect x="576" y="88" width="184" height="44" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="668.0" y="115.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Model</text>
<rect x="576" y="148" width="184" height="44" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="668.0" y="175.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Chat</text>
<rect x="576" y="208" width="184" height="44" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="668.0" y="235.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Stored output</text>
<polyline points="194,94 264,94" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<circle cx="229" cy="94" r="10" fill="#5b9be6"/>
<text x="229" y="98" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<polyline points="194,226 264,226" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<circle cx="229" cy="226" r="10" fill="#5b9be6"/>
<text x="229" y="230" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<polyline points="494,94 530,94 530,166 560,166" fill="none" stroke="#4fbf8c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-green)"/>
<polyline points="494,226 530,226 530,166" fill="none" stroke="#4fbf8c" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="530" cy="130" r="10" fill="#4fbf8c"/>
<text x="530" y="134" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="24" y="314" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">What you see instead:</text>
<rect x="160" y="296" width="334" height="30" rx="15.0" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="327.0" y="315.0" fill="#4fbf8c" font-size="12" font-weight="600" text-anchor="middle">ct:secret:v3:openai-api-key:2d9c4e7a0b16</text>
<circle cx="34" cy="348" r="10" fill="#5b9be6"/>
<text x="34" y="352" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="50" y="352" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">The paste scan checks your message for credential-shaped values</text>
<circle cx="34" cy="370" r="10" fill="#5b9be6"/>
<text x="34" y="374" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="50" y="374" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Secrets and protected identifiers in tool output are replaced</text>
<circle cx="510" cy="348" r="10" fill="#4fbf8c"/>
<text x="510" y="352" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="526" y="352" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">The real value behind a</text>
<text x="526" y="374" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">placeholder never reaches them</text>
</svg>
