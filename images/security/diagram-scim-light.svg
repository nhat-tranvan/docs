<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Assigning a person in the IdP makes them Active; deactivating or unassigning suspends them; reactivating restores them; a SCIM DELETE removes them. Pushed groups map to workspaces and only add access." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Assigning a person in the IdP makes them Active; deactivating or unassigning suspends them; reactivating restores them; a SCIM DELETE removes them. Pushed groups map to workspaces and only add access.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e6e"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd6"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="419" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="36" fill="#0b0b0b" font-size="15" font-weight="600">What SCIM does to a member</text>
<rect x="24" y="100" width="140" height="32" rx="16.0" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
<text x="94.0" y="120.0" fill="#898781" font-size="12" font-weight="600" text-anchor="middle">Assign to the app</text>
<polyline points="164,116 206,116" fill="none" stroke="#898781" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-gray)"/>
<rect x="208" y="80" width="192" height="72" rx="8" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="222" y="104" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Active</text>
<text x="222" y="124" fill="#52514e" font-size="12" text-anchor="start">Auto-assigned role</text>
<text x="222" y="142" fill="#52514e" font-size="12" text-anchor="start">+ auto-assigned workspaces</text>
<rect x="580" y="80" width="196" height="72" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
<text x="594" y="104" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Suspended</text>
<text x="594" y="124" fill="#52514e" font-size="12" text-anchor="start">Loses access to</text>
<text x="594" y="142" fill="#52514e" font-size="12" text-anchor="start">every workspace</text>
<polyline points="400,100 578,100" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<text x="490" y="92" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">Deactivate or unassign</text>
<polyline points="580,134 402,134" fill="none" stroke="#2f9e6e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-green)"/>
<text x="490" y="152" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">Reactivate</text>
<text x="490" y="167" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">(auto-assigned workspaces only)</text>
<rect x="405" y="200" width="170" height="56" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
<text x="490.0" y="224.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Removed</text>
<text x="490.0" y="244.0" fill="#52514e" font-size="12" text-anchor="middle">From the organization</text>
<polyline points="315,152 315,228 403,228" fill="none" stroke="#d64545" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-red)"/>
<polyline points="678,152 678,228 577,228" fill="none" stroke="#d64545" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-red)"/>
<text x="315" y="248" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">Delete (SCIM DELETE)</text>
<rect x="24" y="280" width="752" height="120" rx="10" fill="#f4f3ef" stroke="#e1e0d9"/>
<text x="40" y="304" fill="#898781" font-size="11" font-weight="600" text-anchor="start">GROUPS</text>
<rect x="40" y="314" width="180" height="52" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="54" y="338" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Push a group</text>
<text x="54" y="358" fill="#52514e" font-size="12" text-anchor="start">from your IdP</text>
<rect x="290" y="314" width="200" height="52" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="304" y="338" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Group mappings</text>
<text x="304" y="358" fill="#52514e" font-size="12" text-anchor="start">Pick workspaces per group</text>
<rect x="560" y="314" width="200" height="52" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="574" y="338" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Workspaces</text>
<text x="574" y="358" fill="#52514e" font-size="12" text-anchor="start">Members are added</text>
<polyline points="220,340 288,340" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<polyline points="490,340 558,340" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<text x="760" y="388" fill="#52514e" font-size="12" font-weight="400" text-anchor="end">Add only: leaving a group doesn't remove workspace access</text>
</svg>
