<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="Organization Owners and Admins reach every workspace as Admin; Developers and Viewers reach only workspaces they are added to, with their own role unless an override is set." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Organization Owners and Admins reach every workspace as Admin; Developers and Viewers reach only workspaces they are added to, with their own role unless an override is set.</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e86b6b"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9d84e8"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="349" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">Organization role to workspace access</text>
<text x="24" y="66" fill="#898781" font-size="11" font-weight="600" text-anchor="start">ORGANIZATION ROLE</text>
<text x="400" y="66" fill="#898781" font-size="11" font-weight="600" text-anchor="start">WORKSPACES AND ROLE INSIDE</text>
<rect x="24" y="80" width="200" height="46" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="124.0" y="108.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Owner</text>
<rect x="24" y="142" width="200" height="46" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="124.0" y="170.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Admin</text>
<rect x="24" y="220" width="200" height="46" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="124.0" y="248.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Developer</text>
<rect x="24" y="282" width="200" height="46" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="124.0" y="310.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="middle">Viewer</text>
<rect x="400" y="80" width="376" height="108" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="414" y="104" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Every workspace, automatically</text>
<text x="414" y="124" fill="#c3c2b7" font-size="12" text-anchor="start">Role inside: Admin, fixed</text>
<text x="414" y="142" fill="#c3c2b7" font-size="12" text-anchor="start">Can't be overridden</text>
<rect x="400" y="220" width="376" height="108" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="414" y="244" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Only workspaces they're added to</text>
<text x="414" y="264" fill="#c3c2b7" font-size="12" text-anchor="start">Role inside: Developer or Viewer</text>
<text x="414" y="282" fill="#c3c2b7" font-size="12" text-anchor="start">Override: a different role for one person</text>
<text x="414" y="300" fill="#c3c2b7" font-size="12" text-anchor="start">in one workspace (raise or lower)</text>
<polyline points="224,103 310,103 310,134 398,134" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<polyline points="224,165 310,165 310,134" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="224,259 310,259 310,274 398,274" fill="none" stroke="#4fbf8c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-green)"/>
<polyline points="224,321 310,321 310,274" fill="none" stroke="#4fbf8c" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
