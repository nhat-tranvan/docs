<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Code Audit finding statuses: verification moves a candidate from Needs verification to Confirmed or False positive, you move confirmed work to In progress and Awaiting retest or dismiss it, and a later audit marks it Fixed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Code Audit finding statuses and who moves a finding between them</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="439" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">Who moves a Code Audit finding</text>
<line x1="560" y1="31" x2="590" y2="31" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<text x="596" y="35" fill="#c3c2b7" font-size="12">An audit</text>
<line x1="666" y1="31" x2="696" y2="31" stroke="#f08a5d" stroke-width="1.6" marker-end="url(#a-orange)"/>
<text x="702" y="35" fill="#c3c2b7" font-size="12">You</text>
<rect x="24" y="64" width="160" height="58" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="38" y="88" fill="#f0efec" font-size="13" font-weight="600">Needs verification</text>
<text x="38" y="108" fill="#c3c2b7" font-size="12">Open tab</text>
<rect x="232" y="64" width="140" height="58" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="246" y="88" fill="#f0efec" font-size="13" font-weight="600">Confirmed</text>
<text x="246" y="108" fill="#c3c2b7" font-size="12">Open tab</text>
<rect x="420" y="64" width="140" height="58" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="434" y="88" fill="#f0efec" font-size="13" font-weight="600">In progress</text>
<text x="434" y="108" fill="#c3c2b7" font-size="12">Open tab</text>
<rect x="608" y="64" width="168" height="58" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="622" y="88" fill="#f0efec" font-size="13" font-weight="600">Awaiting retest</text>
<text x="622" y="108" fill="#c3c2b7" font-size="12">Open tab</text>
<rect x="24" y="214" width="160" height="58" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="38" y="238" fill="#f0efec" font-size="13" font-weight="600">False positive</text>
<text x="38" y="258" fill="#c3c2b7" font-size="12">Hidden from lists</text>
<rect x="232" y="214" width="140" height="58" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="246" y="238" fill="#f0efec" font-size="13" font-weight="600">Dismissed</text>
<text x="246" y="258" fill="#c3c2b7" font-size="12">All tab</text>
<rect x="608" y="214" width="168" height="58" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="622" y="238" fill="#f0efec" font-size="13" font-weight="600">Fixed</text>
<text x="622" y="258" fill="#c3c2b7" font-size="12">Fixed tab</text>
<line x1="184" y1="93" x2="230" y2="93" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="207" cy="76" r="10" fill="#5b9be6"/>
<text x="207" y="80" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<line x1="104" y1="122" x2="104" y2="212" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="124" cy="167" r="10" fill="#5b9be6"/>
<text x="124" y="171" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<line x1="372" y1="93" x2="418" y2="93" stroke="#f08a5d" stroke-width="1.6" marker-end="url(#a-orange)"/>
<line x1="560" y1="93" x2="606" y2="93" stroke="#f08a5d" stroke-width="1.6" marker-end="url(#a-orange)"/>
<circle cx="395" cy="76" r="10" fill="#f08a5d"/>
<text x="395" y="80" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<line x1="692" y1="122" x2="692" y2="212" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="712" cy="167" r="10" fill="#5b9be6"/>
<text x="712" y="171" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<line x1="302" y1="122" x2="302" y2="212" stroke="#f08a5d" stroke-width="1.6" marker-end="url(#a-orange)"/>
<circle cx="322" cy="167" r="10" fill="#f08a5d"/>
<text x="322" y="171" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">5</text>
<circle cx="34" cy="314" r="10" fill="#5b9be6"/>
<text x="34" y="318" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="52" y="318" fill="#c3c2b7" font-size="12">Verification confirms a candidate. Only an audit can confirm a finding.</text>
<circle cx="34" cy="340" r="10" fill="#5b9be6"/>
<text x="34" y="344" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="52" y="344" fill="#c3c2b7" font-size="12">A candidate that verification refutes becomes a false positive. Lists and counts leave it out.</text>
<circle cx="34" cy="366" r="10" fill="#f08a5d"/>
<text x="34" y="370" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="52" y="370" fill="#c3c2b7" font-size="12">You move open work to In progress, then to Awaiting retest so the next audit checks it.</text>
<circle cx="34" cy="392" r="10" fill="#5b9be6"/>
<text x="34" y="396" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="52" y="396" fill="#c3c2b7" font-size="12">A later audit that no longer detects the problem marks it Fixed. Only a later audit can reopen it.</text>
<circle cx="34" cy="418" r="10" fill="#f08a5d"/>
<text x="34" y="422" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">5</text>
<text x="52" y="422" fill="#c3c2b7" font-size="12">You can dismiss an open finding with a reason, and reopen it at any time.</text>
</svg>
