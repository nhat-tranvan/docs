<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="How a Code Audit runs: it pins the branch head commit, runs static analysis, the security review and the library inventory in parallel, verifies candidates, then publishes findings and a PDF report" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>How a Code Audit runs: pin the commit, scan and review in parallel, verify, then publish</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="419" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">How a Code Audit runs</text>
<rect x="24" y="56" width="200" height="224" rx="10" fill="#222221" stroke="#2c2c2a" stroke-dasharray="5 4"/>
<text x="40" y="80" fill="#a3a29c" font-size="11" font-weight="600">YOUR GIT PROVIDER</text>
<rect x="248" y="56" width="528" height="224" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="264" y="80" fill="#a3a29c" font-size="11" font-weight="600">CLOUDTHINKER CLOUD</text>
<rect x="40" y="94" width="168" height="96" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="54" y="118" fill="#f0efec" font-size="13" font-weight="600">Release branch</text>
<text x="54" y="138" fill="#c3c2b7" font-size="12">Connected repository</text>
<text x="54" y="156" fill="#c3c2b7" font-size="12">Audit now, the daily</text>
<text x="54" y="174" fill="#c3c2b7" font-size="12">check, or a push</text>
<rect x="264" y="94" width="146" height="70" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="278" y="118" fill="#f0efec" font-size="13" font-weight="600">Pinned commit</text>
<text x="278" y="138" fill="#c3c2b7" font-size="12">Head commit</text>
<text x="278" y="154" fill="#c3c2b7" font-size="12">resolved once</text>
<rect x="264" y="194" width="146" height="70" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="278" y="218" fill="#f0efec" font-size="13" font-weight="600">Libraries</text>
<text x="278" y="238" fill="#c3c2b7" font-size="12">Inventory and</text>
<text x="278" y="254" fill="#c3c2b7" font-size="12">advisory checks</text>
<rect x="436" y="94" width="146" height="70" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="450" y="118" fill="#f0efec" font-size="13" font-weight="600">SAST Scan</text>
<text x="450" y="138" fill="#c3c2b7" font-size="12">Static analysis,</text>
<text x="450" y="154" fill="#c3c2b7" font-size="12">secret scanning</text>
<rect x="436" y="194" width="146" height="70" rx="8" fill="#1f1f1e" stroke="#2c2c2a"/>
<text x="450" y="218" fill="#f0efec" font-size="13" font-weight="600">Security Review</text>
<text x="450" y="238" fill="#c3c2b7" font-size="12">Agents investigate</text>
<text x="450" y="254" fill="#c3c2b7" font-size="12">the source</text>
<rect x="608" y="94" width="146" height="70" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="622" y="118" fill="#f0efec" font-size="13" font-weight="600">Verification</text>
<text x="622" y="138" fill="#c3c2b7" font-size="12">Checks each</text>
<text x="622" y="154" fill="#c3c2b7" font-size="12">candidate's proof</text>
<rect x="608" y="194" width="146" height="70" rx="8" fill="#1f1f1e" stroke="#4fbf8c" stroke-width="1.5"/>
<text x="622" y="218" fill="#f0efec" font-size="13" font-weight="600">Results</text>
<text x="622" y="238" fill="#c3c2b7" font-size="12">Findings and</text>
<text x="622" y="254" fill="#c3c2b7" font-size="12">a PDF report</text>
<line x1="208" y1="129" x2="262" y2="129" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="236" cy="112" r="10" fill="#5b9be6"/>
<text x="236" y="116" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<line x1="410" y1="129" x2="434" y2="129" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<line x1="410" y1="150" x2="434" y2="214" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<line x1="337" y1="164" x2="337" y2="192" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="357" cy="178" r="10" fill="#5b9be6"/>
<text x="357" y="182" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<line x1="582" y1="129" x2="606" y2="129" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<line x1="582" y1="214" x2="606" y2="150" stroke="#5b9be6" stroke-width="1.6" marker-end="url(#a-blue)"/>
<circle cx="594" cy="104" r="10" fill="#5b9be6"/>
<text x="594" y="108" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<line x1="681" y1="164" x2="681" y2="192" stroke="#4fbf8c" stroke-width="1.6" marker-end="url(#a-green)"/>
<circle cx="701" cy="178" r="10" fill="#4fbf8c"/>
<text x="701" y="182" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<circle cx="34" cy="314" r="10" fill="#5b9be6"/>
<text x="34" y="318" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="52" y="318" fill="#c3c2b7" font-size="12">Audit now, the daily check, or a push starts an audit. It pins the branch's head commit.</text>
<circle cx="34" cy="340" r="10" fill="#5b9be6"/>
<text x="34" y="344" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="52" y="344" fill="#c3c2b7" font-size="12">The SAST Scan, the Security Review, and library collection start together on that commit.</text>
<circle cx="34" cy="366" r="10" fill="#5b9be6"/>
<text x="34" y="370" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="52" y="370" fill="#c3c2b7" font-size="12">Verification checks each candidate's proof while the review continues.</text>
<circle cx="34" cy="392" r="10" fill="#4fbf8c"/>
<text x="34" y="396" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text x="52" y="396" fill="#c3c2b7" font-size="12">The audit publishes findings and a PDF report. A failed audit keeps the last published findings.</text>
</svg>
