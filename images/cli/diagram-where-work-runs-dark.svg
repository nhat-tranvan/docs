<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="Local tools run on your machine as your OS user; prompts and what the agent reads go to the model gateway and the Agent CLI mirror; connection credentials stay on the workspace machine" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Local tools run on your machine as your OS user; prompts and what the agent reads go to the model gateway and the Agent CLI mirror; connection credentials stay on the workspace machine</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9be6"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a5d"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fbf8c"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e86b6b"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9d84e8"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
</defs>
<rect x="0.5" y="0.5" width="799" height="429" rx="12" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="36" fill="#f0efec" font-size="15" font-weight="600">Where work runs</text>
<rect x="24" y="56" width="300" height="300" rx="10" fill="#222221" stroke="#2c2c2a" stroke-dasharray="5 4"/>
<text x="40" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">YOUR MACHINE</text>
<rect x="40" y="92" width="268" height="104" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="54" y="116" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">[L] Local tools</text>
<text x="54" y="136" fill="#c3c2b7" font-size="12" text-anchor="start">bash, read, write, edit,</text>
<text x="54" y="154" fill="#c3c2b7" font-size="12" text-anchor="start">grep, find, ls</text>
<text x="54" y="172" fill="#c3c2b7" font-size="12" text-anchor="start">Run as your OS user</text>
<rect x="40" y="232" width="268" height="70" rx="8" fill="#1f1f1e" stroke="#2c2c2a" stroke-width="1"/>
<text x="54" y="256" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Files no tool has read</text>
<text x="54" y="276" fill="#c3c2b7" font-size="12" text-anchor="start">Stay on your machine</text>
<rect x="476" y="56" width="300" height="300" rx="10" fill="#222221" stroke="#2c2c2a"/>
<text x="492" y="80" fill="#898781" font-size="11" font-weight="600" text-anchor="start">CLOUDTHINKER</text>
<rect x="492" y="92" width="268" height="70" rx="8" fill="#1f1f1e" stroke="#5b9be6" stroke-width="1.5"/>
<text x="506" y="116" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Model gateway</text>
<text x="506" y="136" fill="#c3c2b7" font-size="12" text-anchor="start">Your BYOK key first, if set</text>
<rect x="492" y="172" width="268" height="70" rx="8" fill="#1f1f1e" stroke="#9d84e8" stroke-width="1.5"/>
<text x="506" y="196" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Agent CLI conversation</text>
<text x="506" y="216" fill="#c3c2b7" font-size="12" text-anchor="start">The session transcript (mirror)</text>
<rect x="492" y="252" width="268" height="88" rx="8" fill="#1f1f1e" stroke="#f08a5d" stroke-width="1.5"/>
<text x="506" y="276" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">[C] Workspace machine</text>
<text x="506" y="296" fill="#c3c2b7" font-size="12" text-anchor="start">Cloud reads, writes, delegation</text>
<text x="506" y="314" fill="#c3c2b7" font-size="12" text-anchor="start">Connection credentials</text>
<polyline points="308,127 492,127" fill="none" stroke="#5b9be6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<circle cx="400" cy="127" r="10" fill="#5b9be6"/>
<text x="400" y="131" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<polyline points="308,170 400,170 400,207 492,207" fill="none" stroke="#9d84e8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<circle cx="400" cy="188" r="10" fill="#9d84e8"/>
<text x="400" y="192" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<polyline points="492,300 330,300" fill="none" stroke="#e86b6b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/>
<text x="318" y="304" fill="#e86b6b" font-size="16" font-weight="700" text-anchor="middle">x</text>
<circle cx="420" cy="300" r="10" fill="#e86b6b"/>
<text x="420" y="304" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<circle cx="34" cy="380" r="10" fill="#5b9be6"/>
<text x="34" y="384" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text x="50" y="384" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Your prompts and everything the agent reads go to the model</text>
<circle cx="34" cy="402" r="10" fill="#9d84e8"/>
<text x="34" y="406" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text x="50" y="406" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">The session transcript goes to the Agent CLI mirror</text>
<circle cx="450" cy="380" r="10" fill="#e86b6b"/>
<text x="450" y="384" fill="#1a1a19" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text x="466" y="384" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Connection credentials never</text>
<text x="466" y="406" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">come to your machine</text>
</svg>
